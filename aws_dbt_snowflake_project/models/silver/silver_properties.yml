version: 2

models:
  - name: silver_bookings
    config:
      materialized: incremental
      on_schema_change: append_new_columns
      unique_key: booking_id
      incremental_strategy: merge
    columns:
      - name: booking_id
        tests:
          - not_null
          - unique

  - name: silver_hosts
    config:
      materialized: incremental
      on_schema_change: append_new_columns
      unique_key: host_id
      incremental_strategy: merge
    columns:
      - name: host_id
        tests:
          - not_null
          - unique

  - name: silver_listings
    config:
      materialized: incremental
      on_schema_change: append_new_columns
      unique_key: listing_id
      incremental_strategy: merge
    columns:
      - name: listing_id
        tests:
          - not_null
          - unique
