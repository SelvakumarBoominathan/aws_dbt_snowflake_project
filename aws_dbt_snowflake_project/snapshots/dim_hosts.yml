snapshots:
  - name: dim_hosts
    relation: ref('hosts')
    description: ephemeral model for hosts table from gold layer.
    config:
      database: AIRBNB
      schema: gold
      strategy: timestamp
      unique_key: HOST_ID
      updated_at: HOST_CREATED_AT
      dbt_valid_to_current: "to_date('9999-12-31')"
